name: botai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты обвязки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Синтаксис скриптов
        run: python3 -m py_compile scripts/*.py

      - name: Тесты обновления
        # Проверяют правила, ради которых обновление существует: студенческие
        # каталоги не трогаются, локальная правка сохраняется, архив с выходом
        # за каталог отвергается, грязный курс не обновляется.
        run: python3 tests/test_update.py

      - name: Тесты путей, предпросмотра и границ workspace
        # Проверяют, что имя курса — имя, а не путь; что симлинк за пределы
        # workspace отвергается; что --dry-run ничего не пишет; что каталог
        # курса не удаляется ради переустановки; что .botai/ не попадает в git.
        run: python3 tests/test_paths.py

      - name: Зависимости ядра и тесты контрактов, записи и миграции
        # Контракты валидируются jsonschema из lock-файла: проверяем, что
        # закреплённые версии и хеши действительно устанавливаются, иначе
        # проверки контрактов молча деградируют до «недоступно».
        #
        # Всё в одном шаге: интерпретатор venv передаётся через переменную
        # внутри шага, а не через GITHUB_ENV, чтобы шаг не зависел от порядка
        # и от платформы. Путь к интерпретатору внутри venv различается
        # (bin/python против Scripts/python.exe), поэтому он вычисляется.
        shell: bash
        run: |
          set -e
          python3 -m venv .core-venv
          if [ -x .core-venv/bin/python ]; then
            VPY="$PWD/.core-venv/bin/python"
          else
            VPY="$PWD/.core-venv/Scripts/python.exe"
          fi
          echo "venv python: $VPY"
          "$VPY" -m pip install --quiet --require-hashes -r requirements-core.lock
          "$VPY" -c "import jsonschema; print('jsonschema ok')"
          "$VPY" tests/test_schemas.py
          "$VPY" tests/test_store.py
          "$VPY" tests/test_course.py
          "$VPY" tests/test_policy.py

      - name: Принятый курс управляет помощью, а не рабочая копия
        # Сквозная проверка самого важного обещания: правка
        # botai/course.json в рабочей копии не меняет политику, а оцениваемое
        # задание не получает готовый разбор. Здесь проверяется связка
        # CLI + ядро на настоящем каталоге, а не только модуль по отдельности.
        shell: bash
        run: |
          set -e
          rm -rf /tmp/botai-policy && mkdir -p /tmp/botai-policy/courses
          cp -r examples/minimal-course /tmp/botai-policy/courses/minimal-diff

          python3 scripts/cli.py course-inspect --course minimal-diff \
            --root /tmp/botai-policy | tee /tmp/inspect.txt
          grep -q "готовность  : inspectable" /tmp/inspect.txt

          python3 scripts/cli.py course-accept --course minimal-diff \
            --root /tmp/botai-policy | tee /tmp/accept.txt
          grep -q "контракт" /tmp/accept.txt

          # Тренировочное задание: полный разбор допустим по просьбе ученика.
          python3 scripts/cli.py policy-check --course minimal-diff \
            --assignment practice-diff --level SOLUTION --preference prefer-ask \
            --root /tmp/botai-policy | tee /tmp/practice.txt
          grep -q "решение     : allow" /tmp/practice.txt

          # Необъявленное задание: строгий режим, готовый разбор запрещён.
          if python3 scripts/cli.py policy-check --course minimal-diff \
               --assignment never-declared --level SOLUTION --preference solution-first \
               --root /tmp/botai-policy | tee /tmp/unknown.txt; then
            echo "необъявленное задание получило разрешение"; exit 1
          fi
          grep -q "SOLUTION_NOT_ALLOWED_FOR_ASSESSMENT" /tmp/unknown.txt

          # Рабочая копия переклассифицирует задание: принятая политика в силе.
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/botai-policy/courses/minimal-diff/botai/course.json")
          doc = json.loads(p.read_text(encoding="utf-8"))
          doc["assignments"][0]["assessment"] = "graded"
          p.write_text(json.dumps(doc, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python3 scripts/cli.py course-status --course minimal-diff \
            --root /tmp/botai-policy | tee /tmp/status.txt
          grep -q "контракт изменён : да" /tmp/status.txt
          grep -q "принято 'practice' -> в копии 'graded'" /tmp/status.txt
          echo "принятая политика не следует за рабочей копией: ok"

      - name: Установка в отдельный проект, git и самообновление
        # Сквозная проверка: установщик → git-гигиена → обновление → предпросмотр.
        # Ломается, если обвязка перестала быть самоустанавливаемой и
        # самообновляемой, или если приватное состояние попало в историю.
        run: |
          set -e
          python3 scripts/install.py --dest /tmp/botai-ci --no-git >/dev/null
          test -f /tmp/botai-ci/VERSION
          test -f /tmp/botai-ci/.botai/install.json
          python3 /tmp/botai-ci/scripts/cli.py doctor >/dev/null
          # Источник — сам чекаут: локальный каталог читается без сети.
          python3 /tmp/botai-ci/scripts/cli.py update --source "$PWD" --dry-run >/dev/null
          echo "install → update --dry-run: ok"

      - name: Приватное состояние не попадает в git
        # .botai/ содержит записи установки и резервные копии правок студента;
        # оно обязано быть исключено ДО первого git add -A. Правила привязаны к
        # корню проекта (`/.botai/`), поэтому и проверяем через git, а не
        # сравнением строк: вопрос в том, игнорируется ли путь, а не в том,
        # как именно записано правило.
        run: |
          set -e
          rm -rf /tmp/botai-git
          python3 scripts/install.py --dest /tmp/botai-git >/dev/null
          for probe in .botai/install.json courses/x/y.md progress/x.md; do
            if ! git -C /tmp/botai-git check-ignore -q "$probe"; then
              echo "путь не игнорируется: $probe"
              git -C /tmp/botai-git status --porcelain | head
              exit 1
            fi
          done
          tracked="$(git -C /tmp/botai-git ls-files)"
          if echo "$tracked" | grep -qE '^(\.botai|courses|progress|dist)/'; then
            echo "приватные каталоги попали в индекс:"; echo "$tracked" | grep -E '^(\.botai|courses|progress|dist)/'
            exit 1
          fi
          echo "git-гигиена установки: ok ($(echo "$tracked" | wc -l) файлов, приватных нет)"

      - name: Проверка отпечатка установки
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "scripts")
          import harness as H
          rec = json.load(open("/tmp/botai-ci/.botai/install.json", encoding="utf-8"))
          current = H.fingerprint(pathlib.Path("/tmp/botai-ci"))
          missing = [r for r in rec["files"] if r not in current]
          assert not missing, "файлы обвязки пропали после установки: %s" % missing[:5]
          print("отпечаток установки согласован: %d файлов" % len(rec["files"]))
          PY

      - name: Makefile и CLI отвечают
        run: |
          set -e
          make help >/dev/null
          python3 scripts/cli.py --help >/dev/null
          python3 scripts/courses.py --help >/dev/null

      - name: Проверка, что отчёт обновления не пуст
        # Обновление обязано перечислить, что произошло: молчаливое обновление
        # нельзя ни проверить, ни откатить.
        run: |
          set -e
          mkdir -p /tmp/up-src/.agents/skills/s
          cp -r scripts docs .agents .opencode AGENTS.md README.md Makefile VERSION /tmp/up-src/
          sed -i 's/^1\./2./' /tmp/up-src/VERSION
          out="$(python3 /tmp/botai-ci/scripts/cli.py update --source /tmp/up-src --dry-run)"
          echo "$out"
          echo "$out" | grep -q "версия в источнике" || { echo "отчёт об обновлении не описывает источник"; exit 1; }

  cross-platform:
    name: Пути и workspace (${{ matrix.os }})
    # Path handling is exactly what differs between Windows, macOS and Linux:
    # drive letters, junctions, case-insensitive names, device names and
    # symlink rules. Running only on Ubuntu would leave that untested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Тесты путей и предпросмотра
        run: python3 tests/test_paths.py

      - name: Тесты обновления
        run: python3 tests/test_update.py

      - name: Тесты принятого курса и политики
        # Принятие курса пишет снимки в `.botai/` и сравнивает пути, поэтому
        # проверяется и на Windows: короткие имена, регистр и junction ведут
        # себя иначе, чем на Linux.
        shell: bash
        run: |
          set -e
          python3 -m venv .win-venv
          if [ -x .win-venv/bin/python ]; then
            VPY="$PWD/.win-venv/bin/python"
          else
            VPY="$PWD/.win-venv/Scripts/python.exe"
          fi
          "$VPY" -m pip install --quiet --require-hashes -r requirements-core.lock
          "$VPY" tests/test_course.py
          "$VPY" tests/test_policy.py
