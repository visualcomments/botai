# botai core dependencies — pinned, hash-verified.
#
# Install with:
#   python3 -m pip install --require-hashes -r requirements-core.lock
#
# Why a lock file instead of a version range: the core validates the contracts
# that decide what help a student may receive. A dependency that changes
# resolution behaviour between installs can turn a refused document into an
# accepted one, and "it worked yesterday" is not a property a study record can
# be built on. `--require-hashes` makes an unexpected artefact a hard failure.
#
# Scope: only `jsonschema` and its transitive runtime dependencies. The MCP
# adapter has its own lock file and is optional — the core must remain usable
# without it, and the workspace CLI must remain usable without any of this
# (stdlib only), so that a missing dependency can be diagnosed rather than
# crashing the tool that would explain how to install it.
#
# Wheels are pinned per platform where the artefact is platform-specific
# (rpds-py). Adding a platform means adding its hash here, deliberately.

