# Platform-specific wheel. `rpds-py` ships a different artefact per platform and
# Python version, so each supported combination needs its own hash here — the
# correct response to a new platform is a second recorded hash, never a loosened
# pin. `pip install --require-hashes` fails loudly when no recorded artefact
# matches, which is the intended outcome: an unverified wheel must not silently
# take its place.
#
# Hashes are from the PyPI JSON API for this exact version. The artefacts are:
#   cp314 manylinux x86_64  rpds_py-2026.6.3-cp314-cp314-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
#   cp314 win_amd64         rpds_py-2026.6.3-cp314-cp314-win_amd64.whl
#   cp314 macosx 11 arm64   rpds_py-2026.6.3-cp314-cp314-macosx_11_0_arm64.whl
#   cp314 macosx 10.12 x64  rpds_py-2026.6.3-cp314-cp314-macosx_10_12_x86_64.whl
#   cp313 manylinux x86_64  rpds_py-2026.6.3-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
#   cp313 win_amd64         rpds_py-2026.6.3-cp313-cp313-win_amd64.whl
#   cp313 macosx 11 arm64   rpds_py-2026.6.3-cp313-cp313-macosx_11_0_arm64.whl
#   cp313 macosx 10.12 x64  rpds_py-2026.6.3-cp313-cp313-macosx_10_12_x86_64.whl
#   cp312 manylinux x86_64  rpds_py-2026.6.3-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
#   cp312 win_amd64         rpds_py-2026.6.3-cp312-cp312-win_amd64.whl
#   cp312 macosx 11 arm64   rpds_py-2026.6.3-cp312-cp312-macosx_11_0_arm64.whl
#   cp312 macosx 10.12 x64  rpds_py-2026.6.3-cp312-cp312-macosx_10_12_x86_64.whl
#
# The labels stay in comments ABOVE the requirement: a `#` inside a
# line-continuation block ends the requirement, and pip then warns that each
# `--hash` line has no requirement and ignores it.
